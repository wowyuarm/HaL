[project]
name = "HaL"
version = "0.1.0"
description = "Collaborative intelligence framework for human-AI partnership"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "hal contributors"}
]
keywords = ["ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "setuptools>=40.0.0,<81",
    "typer>=0.9.0",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "websocket-client>=1.6.0",
    "httpx[socks]>=0.25.0",
    "loguru>=0.7.0",
    "readability-lxml>=0.8.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-telegram-bot[socks]>=21.0",
    "lark-oapi>=1.0.0",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
memory = [
    "pymilvus>=2.5.0",
    "milvus-lite>=2.5.0",
]

[project.scripts]
hal = "hal.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hal"]

[tool.hatch.build.targets.wheel.sources]
"hal" = "hal"

# Include package Python code and bundled Node bridge script.
[tool.hatch.build]
include = [
    "hal/**/*.py",
    "hal/**/*.mjs"
]

[tool.hatch.build.targets.sdist]
include = [
    "hal/",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
